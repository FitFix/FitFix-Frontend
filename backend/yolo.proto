syntax = "proto3";

package yolo;

service YoloPose {
  rpc Predict (PredictRequest) returns (PredictResponse);
}

message PredictRequest {
  string image = 1; // Base64 encoded image string
}

message Keypoint {
  float x = 1;
  float y = 2;
  float score = 3;
  string name = 4;
}

message PredictResponse {
  repeated Keypoint keypoints = 1;
}
